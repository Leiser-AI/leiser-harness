[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0-beta.2"
edition = "2024"
rust-version = "1.90"
license-file = "LICENSE.md"
publish = false

# The workspace's own crates, at the workspace's version: a version bump
# changes `version` above and these requirements, nothing in the crates.
[workspace.dependencies]
leiser-service = { version = "=0.2.0-beta.2", path = "crates/leiser-service" }
leiser-terminal = { version = "=0.2.0-beta.2", path = "crates/leiser-terminal" }
leiser-testkit = { version = "=0.2.0-beta.2", path = "crates/leiser-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
