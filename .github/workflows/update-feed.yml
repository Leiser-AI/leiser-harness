name: Update feed

# Serves a published release to the installed apps (ADR 0009): copies its
# update manifest `latest.json` to the branch `update-feed`, as `beta.json`
# and, for a release that is not a pre-release, also as `stable.json`.
# Installed apps read
# https://raw.githubusercontent.com/<repo>/update-feed/<channel>.json.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release to serve, such as v0.2.0-beta.1
        required: true

permissions:
  contents: read

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  feed:
    name: update feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Read the release
        id: release
        run: |
          prerelease=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease,isDraft \
            --jq 'if .isDraft then error("the release is a draft") else .isPrerelease end')
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir manifest
      - name: Check out the feed
        run: |
          git init -q feed
          cd feed
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin update-feed; then
            git checkout -q -b update-feed FETCH_HEAD
          else
            git checkout -q --orphan update-feed
          fi
      - name: Publish the manifest
        working-directory: feed
        run: |
          cp ../manifest/latest.json beta.json
          if [ "${{ steps.release.outputs.prerelease }}" = "false" ]; then
            cp ../manifest/latest.json stable.json
          fi
          git add beta.json stable.json 2>/dev/null || git add beta.json
          if git diff --cached --quiet; then
            echo "The feed already serves $TAG."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Serve $TAG"
          git push -q origin update-feed
