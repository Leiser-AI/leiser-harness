name: CI

on:
  push:
    branches: [main, development, "hotfix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job and the apt-get step get a time limit of several times their
# usual length, so a hung step (such as apt-get waiting on a mirror) fails
# instead of running for GitHub's default 6 hours, and Auto-fix sees it.

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The desktop app (Tauri) links against WebKitGTK on Linux. The
      # runner's apt tries the Azure mirror first and falls back to
      # archive.ubuntu.com per package only after a timeout, so a stalled
      # Azure mirror held a run for 40 minutes; this step skips it.
      - &install-tauri-libraries
        name: Install Tauri system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The repository is public, so GitHub's runners cost nothing: every
        # pull request and push tests on all three systems.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - *install-tauri-libraries
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  ui:
    name: desktop UI (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/leiser-desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: crates/leiser-desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  deny:
    name: dependencies (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.99.8
        with:
          extra_args: --only-verified
