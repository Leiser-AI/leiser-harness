name: Release

# Builds the installers on GitHub's runners. A version tag (`v*`) also puts
# them on a draft GitHub release, which the user publishes. A pull request
# that changes the packaging builds them without publishing anything.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - crates/leiser-desktop/tauri.conf.json
      - crates/leiser-desktop/tauri.release.conf.json
      - crates/leiser-desktop/scripts/**
      - crates/leiser-desktop/package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: installers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            installers: |
              target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            installers: |
              target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          # The oldest supported Ubuntu, so the AppImage runs on older
          # glibc versions too.
          - name: Linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            installers: |
              target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: crates/leiser-desktop/package-lock.json
      - name: Build the installers
        working-directory: crates/leiser-desktop
        env:
          # The runners have no FUSE to mount the AppImage tools with.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          npm ci
          npm run package -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --generate-notes \
            --title "leiser-harness $GITHUB_REF_NAME"
