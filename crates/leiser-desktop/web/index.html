<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>leiser-harness</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <aside class="sidebar">
      <header class="sidebar-header">
        <span class="app-name">leiser-harness</span>
        <button id="add-repository" type="button">Add repository</button>
      </header>
      <nav id="repositories" aria-label="Repositories and chats"></nav>
    </aside>
    <header class="top-bar" id="top-bar"></header>
    <main class="chat">
      <div id="error" class="error" role="alert" hidden></div>
      <ol id="transcript" class="transcript" aria-live="polite"></ol>
      <form id="composer" class="composer" hidden>
        <textarea id="message" rows="3" placeholder="Message the agent (Enter sends or queues, Shift+Enter adds a line)"></textarea>
        <div class="composer-actions">
          <button id="send" type="submit">Send</button>
          <button id="interrupt" type="button" hidden>Interrupt</button>
        </div>
      </form>
    </main>
    <aside id="todos" class="todos" aria-label="Todo list" hidden>
      <h2 class="todos-header">Todos</h2>
      <ul id="todo-list" class="todo-list"></ul>
      <form id="todo-form" class="todo-form">
        <input id="todo-text" type="text" placeholder="Add a todo" aria-label="New todo" />
        <button type="submit">Add</button>
      </form>
    </aside>
  </body>
</html>
