[package]
name = "leiser-desktop"
description = "The desktop app: renders what the harness service reports (ADR 0004)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
leiser-service = { version = "0.1.0", path = "../leiser-service" }
# Until the real drivers land (#26, #27), chats run on the fake agent CLI.
leiser-testkit = { version = "0.1.0", path = "../leiser-testkit" }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
