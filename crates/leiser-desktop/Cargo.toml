[package]
name = "leiser-desktop"
description = "The desktop app: renders what the harness service reports (ADR 0004)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
leiser-service.workspace = true
leiser-terminal.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy", "zip"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
flate2 = "1.1.11"
rustix = { version = "1.1.6", features = ["fs"] }
tar = "0.4.46"
tempfile = "3.27.0"
