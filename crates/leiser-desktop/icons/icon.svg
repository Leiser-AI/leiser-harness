<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Source artwork of the desktop app icon. The other files in this directory
    are generated from it; the desktop README says how ("App icon").

    The motif is the Leiser AI logo: a square frame that is open at the
    bottom right, where its bottom side ends in a short hook, and a bar inside
    it. The hook and the bar have slanted tops. The logo is flat black and
    casts a long grey shadow to the bottom right, which grows fainter with
    the distance and ends inside the frame with an edge.

    Layout follows Apple's macOS app icon grid: an 824x824 rounded rectangle
    centred on the 1024x1024 canvas, 100px margin, with its drop shadow.
  -->
  <defs>
    <!-- Icon shape: the rounded rectangle of Apple's macOS app icon template.
         The desktop README says why it must stay this one ("App icon"). -->
    <rect id="shape" x="100" y="100" width="824" height="824" rx="185.4"/>
    <clipPath id="inside-shape"><use href="#shape"/></clipPath>
    <filter id="shape-shadow" color-interpolation-filters="sRGB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity="0.32"/>
    </filter>

    <!-- The logo: frame, hook and bar. It takes fill and stroke from where it is used. -->
    <g id="logo" stroke-linecap="round" stroke-linejoin="round">
      <path d="M782,782 L782,318 A76,76 0 0 0 706,242 L318,242 A76,76 0 0 0 242,318 L242,706 A76,76 0 0 0 318,782 L654,782" fill="none" stroke-width="60"/>
      <path d="M636,679.7 L672,720.3 L672,782 L636,782Z" stroke-width="24"/>
      <path d="M406,364.9 L446,410.1 L446,634 L406,634Z" stroke-width="28"/>
    </g>

    <!-- The long shadow is 256 copies of the logo, each one pixel further to
         the right and down than the one before. sweep-N holds N copies: the
         group before it, plus that group again, moved by its number of copies. -->
    <g id="sweep-2"><use href="#logo"/><use href="#logo" transform="translate(1 1)"/></g>
    <g id="sweep-4"><use href="#sweep-2"/><use href="#sweep-2" transform="translate(2 2)"/></g>
    <g id="sweep-8"><use href="#sweep-4"/><use href="#sweep-4" transform="translate(4 4)"/></g>
    <g id="sweep-16"><use href="#sweep-8"/><use href="#sweep-8" transform="translate(8 8)"/></g>
    <g id="sweep-32"><use href="#sweep-16"/><use href="#sweep-16" transform="translate(16 16)"/></g>
    <g id="sweep-64"><use href="#sweep-32"/><use href="#sweep-32" transform="translate(32 32)"/></g>
    <g id="sweep-128"><use href="#sweep-64"/><use href="#sweep-64" transform="translate(64 64)"/></g>
    <g id="sweep-256"><use href="#sweep-128"/><use href="#sweep-128" transform="translate(128 128)"/></g>
    <!-- Makes the shadow fainter along its direction. -->
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="330" y1="330" x2="830" y2="830">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <mask id="fading" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- Background -->
  <use href="#shape" fill="#000000" filter="url(#shape-shadow)"/>
  <use href="#shape" fill="#ffffff"/>
  <!-- A faint outline keeps the white shape visible on a white background. -->
  <use href="#shape" fill="none" stroke="#000000" stroke-opacity="0.1" stroke-width="3"
       transform="translate(512 512) scale(0.998) translate(-512 -512)"/>

  <!-- Long shadow, cut off at the edge of the shape -->
  <use href="#sweep-256" fill="#bfc3cd" stroke="#bfc3cd" mask="url(#fading)" clip-path="url(#inside-shape)"/>

  <!-- Logo -->
  <use href="#logo" fill="#000000" stroke="#000000"/>
</svg>
