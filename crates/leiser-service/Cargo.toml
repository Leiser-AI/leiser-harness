[package]
name = "leiser-service"
description = "The harness service: owns repositories, chats and agent sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
tokio = { version = "1.54.1", features = ["rt", "sync", "macros", "process", "io-util", "time", "net"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
