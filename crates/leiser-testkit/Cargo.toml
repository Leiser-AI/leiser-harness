[package]
name = "leiser-testkit"
description = "Test kit for the harness service: a scripted fake agent CLI and helpers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "fake-agent-cli"
path = "src/bin/fake-agent-cli.rs"

[[bin]]
name = "fake-gh"
path = "src/bin/fake-gh.rs"

[dependencies]
leiser-service.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "process", "io-util", "time", "macros"] }
