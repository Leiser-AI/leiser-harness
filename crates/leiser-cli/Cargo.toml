[package]
name = "leiser-cli"
description = "Lightweight command-line client for inspecting and queueing tasks in leiser-harness over the local interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "leiser"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
leiser-service.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "net"] }

[dev-dependencies]
leiser-testkit.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "time", "net", "macros", "process"] }
