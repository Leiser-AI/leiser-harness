# cargo-deny: checks dependencies for known vulnerabilities and licenses.
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licenses that are compatible with redistributing under
# PolyForm Noncommercial. Add more only after checking them.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# The desktop app's Tauri pulls in these MPL-2.0 crates (CSS parsing in
# tauri-utils and wry, `option-ext` via `dirs`). MPL-2.0 is file-level
# copyleft: we use them unmodified from crates.io, so their source stays
# available. Allowed per crate, not for the whole tree.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
]

# Our own crates are `publish = false` and licensed under PolyForm
# Noncommercial (LICENSE.md); `private.ignore` skips them here.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
