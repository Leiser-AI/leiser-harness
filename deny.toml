# cargo-deny: checks dependencies for known vulnerabilities and licenses.
# Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # `proc-macro-error` is unmaintained, not vulnerable. It is a proc macro
  # pulled in only on Linux through Tauri's gtk-rs 0.18 (glib-macros); v1
  # ships for macOS and Windows only. No upgrade exists until Tauri replaces
  # gtk-rs 0.18. Re-check on the next Tauri update.
  { id = "RUSTSEC-2024-0370", reason = "unmaintained proc macro, Linux-only via Tauri's gtk-rs 0.18; no upgrade available" },
  # `zvariant`, `zvariant_derive` and `zbus_names` are unmaintained, not
  # vulnerable: they were merged into `zbus` 6. They come in only on Linux,
  # through `tauri-plugin-notification`'s `zbus` 5 (the desktop app's OS
  # notifications); v1 ships for macOS and Windows only. Re-check when the
  # plugin moves to `zbus` 6.
  { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; Linux-only via tauri-plugin-notification's zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; Linux-only via tauri-plugin-notification's zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; Linux-only via tauri-plugin-notification's zbus 5" },
]

[licenses]
version = 2
# Permissive licenses that are compatible with redistributing under
# PolyForm Noncommercial. Add more only after checking them.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"
# The desktop app's Tauri pulls in these MPL-2.0 crates (CSS parsing in
# tauri-utils and wry, `option-ext` via `dirs`). MPL-2.0 is file-level
# copyleft: we use them unmodified from crates.io, so their source stays
# available. Allowed per crate, not for the whole tree.
exceptions = [
  { crate = "cssparser", allow = ["MPL-2.0"] },
  { crate = "cssparser-macros", allow = ["MPL-2.0"] },
  { crate = "dtoa-short", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
  { crate = "selectors", allow = ["MPL-2.0"] },
]

# Our own crates are `publish = false` and licensed under PolyForm
# Noncommercial (LICENSE.md); `private.ignore` skips them here.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
